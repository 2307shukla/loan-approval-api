spring.application.name=loan-approval-api
server.port=${PORT:8080}

# --- Security -----------------------------------------------------------
# Signing key for login tokens (min 32 bytes). Set JWT_SECRET; no default on purpose.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# --- Database -----------------------------------------------------------
# Local/dev default is an in-memory H2 database (data is lost on restart).
# For production set DATABASE_URL (jdbc:postgresql://host:5432/db), DB_USERNAME, DB_PASSWORD.
# The JDBC driver and Hibernate dialect are detected from the URL.
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:loandb}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=10000
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false

# --- Operations ---------------------------------------------------------
# H2 console is off unless the dev profile is active (see application-dev.properties).
spring.h2.console.enabled=false
# Behind a proxy (Render) take the real client IP / scheme from X-Forwarded-* headers,
# so rate limiting is per client and not per proxy.
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.compression.enabled=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
